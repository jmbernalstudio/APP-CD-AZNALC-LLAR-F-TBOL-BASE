<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C.D. Aznalcóllar Fútbol Base</title>
<meta name="description" content="App interna del CD Aznalcóllar Fútbol Base para entrenadores y junta directiva.">
<meta name="theme-color" content="#0047A0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/escudo-160.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C.D. Aznalcóllar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <div class="demo pad" role="region" aria-label="Modo demostración">
    <span><b>Demostración</b> · datos de ejemplo</span>
    <div class="seg" role="group" aria-label="Ver como">
      <button type="button" id="role-coach" aria-pressed="true">Entrenador</button>
      <button type="button" id="role-board" aria-pressed="false">Junta</button>
    </div>
    <label class="toggle"><input type="checkbox" id="bigtext"> Letra grande</label>
  </div>
  <header class="pad" id="top"></header>
  <main id="main" class="pad" tabindex="-1"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="brand"><img src="icons/escudo-160.png" alt="Escudo del C.D. Aznalcóllar"><span class="mast-name">C.D. Aznalcóllar<small>Fútbol Base</small></span></div><ul id="tabs"></ul></nav>
<div id="live" class="sr" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:16px">Esta app necesita JavaScript activado.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
